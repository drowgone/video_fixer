<!-- @dsCard group="Type" viewport="700x190" name="Wordmark & Display" subtitle="Roboto Black set tight for the logo lockup; spaced wide on the splash" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-app); display: flex; flex-direction: column; gap: 22px; }
  .block { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .spec { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-quaternary); }
</style>
</head>
<body>
  <div class="block">
    <span style="font-weight:var(--weight-black); font-size:var(--text-6xl); letter-spacing:var(--tracking-tight); color:var(--text-primary)">VideoFixer</span>
    <span class="spec">home wordmark · 32 / 900 / -0.5</span>
  </div>
  <div class="block">
    <span style="font-weight:var(--weight-bold); font-size:var(--text-5xl); letter-spacing:var(--tracking-wider); color:var(--text-primary)">VIDEOFIXER</span>
    <span class="spec">splash · 28 / 700 / +2.0</span>
  </div>
  <div class="block">
    <span style="font-size:var(--text-md); letter-spacing:var(--tracking-wide); color:var(--text-tertiary)">SHORTS CONVERTER</span>
    <span class="spec">overline · 14 / +1.5 / 54%</span>
  </div>
</body>
</html>
