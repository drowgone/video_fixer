<!-- @dsCard group="Type" viewport="700x230" name="Editor Overlay Fonts" subtitle="The 10 Google display faces offered for on-video text in the editor" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--surface-app-deep); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 28px; }
  .item { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--divider); padding-bottom: 7px; }
  .demo { color: var(--text-primary); font-size: 22px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--text-quaternary); white-space: nowrap; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><span class="demo" style="font-family:var(--font-poppins)">Shorts time</span><span class="name">Poppins</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-montserrat); font-weight:800">Shorts time</span><span class="name">Montserrat</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-bebas); letter-spacing:1px">SHORTS TIME</span><span class="name">Bebas Neue</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-anton)">SHORTS TIME</span><span class="name">Anton</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-pacifico); font-size:20px">Shorts time</span><span class="name">Pacifico</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-dancing); font-weight:700">Shorts time</span><span class="name">Dancing Script</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-nunito); font-weight:800">Shorts time</span><span class="name">Nunito</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-raleway); font-weight:700">Shorts time</span><span class="name">Raleway</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-righteous)">Shorts time</span><span class="name">Righteous</span></div>
    <div class="item"><span class="demo" style="font-family:var(--font-sans); font-weight:700">Shorts time</span><span class="name">Roboto (default)</span></div>
  </div>
</body>
</html>
