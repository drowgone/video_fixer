<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoFixer — Mobile App UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #161616 0%, var(--surface-app-deep) 70%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    box-sizing: border-box; font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  #root { display: flex; align-items: center; justify-content: center; }
  * { box-sizing: border-box; }

  @keyframes vf-statusdot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes vf-spin { to { transform: rotate(360deg); } }
  .vf-spin { animation: vf-spin 1.1s linear infinite; }

  /* brand range slider (volume) */
  .vf-range { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px;
    background: var(--white-12); outline: none; }
  .vf-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%; background: var(--red-500);
    box-shadow: 0 0 0 4px var(--red-15); cursor: pointer; }
  .vf-range::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%;
    background: var(--red-500); box-shadow: 0 0 0 4px var(--red-15); cursor: pointer; }

  /* hide scrollbars inside the phone for a native feel */
  #root ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="vf-data.js"></script>
  <script type="text/babel" src="vf-kit.jsx"></script>
  <script type="text/babel" src="vf-home.jsx"></script>
  <script type="text/babel" src="vf-history.jsx"></script>
  <script type="text/babel" src="vf-settings.jsx"></script>
  <script type="text/babel" src="vf-shell.jsx"></script>
  <script type="text/babel" data-presets="react">
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.VFApp));
  </script>
</body>
</html>
